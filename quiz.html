<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTrack Advisor | Quiz</title>
</head>
<body>
    <header>
        <span>DevJourney Advisor</span>
        <div id="timer">03:00</div>
    </header>

    <main>
        <section>
            <div>
                <div id="progressBar" style="height: 10px; background: gray; width: 0%;"></div>
            </div>
            
            <div id="questionContainer">
                <h2 id="questionText">Question goes here</h2>
                
                <!-- Media containers for multimedia questions -->
                <div id="audioContainer" style="display: none;">
                    <audio id="questionAudio" controls></audio>
                </div>
                
                <div id="imageContainer" style="display: none;">
                    <img id="questionImage" src="" alt="Question Image">
                </div>

                <div id="optionsGrid">
                    <!-- Options will be dynamically populated here -->
                </div>
            </div>
            
            <div>
                <br>
                <button id="prevBtn" disabled>Previous</button>
                <button id="nextBtn" disabled>Next</button>
            </div>
        </section>
    </main>

    <script src="js/quiz.js"></script>
</body>
</html>
