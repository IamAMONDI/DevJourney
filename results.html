<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTrack Advisor | Results</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <span class="nav-brand">DevJourney Advisor</span>
            <a href="index.html">Restart</a>
        </div>
    </header>

    <main class="container">
        <section class="results-section">
            <h2 id="welcomeText" style="text-align: center; margin-bottom: 1rem;">Your Specialisation Profile</h2>
            <p id="resultSummary" style="text-align: center;">Based on your responses, here is your compatibility score across the four BSE specialisations.</p>
            
            <div class="chart-container">
                <canvas id="radarChart" width="400" height="400"></canvas>
            </div>
            
            <div id="recommendation" style="margin-top: 2rem; padding: 1.5rem; background: rgba(59, 130, 246, 0.1); border-radius: 8px; border-left: 4px solid var(--primary-color);">
                <h3>Top Recommendation: <span id="topSpec">...</span></h3>
                <p id="topSpecDesc">Loading your personalized insight...</p>
            </div>

            <div style="margin-top: 2rem; text-align: center;">
                <a href="contact.html" class="btn-primary" style="display: inline-block; text-decoration: none; width: auto;">Have Questions? Contact Us</a>
            </div>
        </section>
    </main>

    <script src="js/canvas.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const studentData = JSON.parse(localStorage.getItem('studentData')) || { name: 'Student' };
            document.getElementById('welcomeText').textContent = `${studentData.name}'s Specialisation Profile`;
            
            const scores = JSON.parse(localStorage.getItem('quizScores')) || { lowLevel: 1, fullStack: 1, arVr: 1, machineLearning: 1 };
            
            // Find top score
            let maxScore = -1;
            let topSpec = '';
            for (const [key, val] of Object.entries(scores)) {
                if (val > maxScore) {
                    maxScore = val;
                    topSpec = key;
                }
            }
            
            const specNames = {
                lowLevel: 'Low-Level Architecture',
                fullStack: 'Full-Stack Engineering',
                arVr: 'AR/VR Development',
                machineLearning: 'Machine Learning'
            };

            const specDesc = {
                lowLevel: 'You have a strong inclination towards systems programming, operating systems, and hardware-software interaction.',
                fullStack: 'You enjoy building complete solutions from beautiful user interfaces to robust backend databases.',
                arVr: 'You are fascinated by spatial computing, 3D graphics, and immersive interactive experiences.',
                machineLearning: 'You love data, algorithms, and training AI models to solve complex predictive problems.'
            };
            
            document.getElementById('topSpec').textContent = specNames[topSpec] || 'Balanced Profile';
            document.getElementById('topSpecDesc').textContent = specDesc[topSpec] || 'You have diverse interests. Consider speaking with an advisor to narrow it down!';

            // Render Radar Chart
            renderRadarChart('radarChart', scores);
        });
    </script>
</body>
</html>
