<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechTrack Advisor | Contact Us</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <span class="nav-brand">DevJourney Advisor</span>
            <a href="index.html">Home</a>
        </div>
    </header>

    <main class="container">
        <section class="contact-section">
            <h2>Contact an Advisor</h2>
            <p>Still not sure which path to choose? Send us a message and an academic advisor will get back to you.</p>
            
            <form id="contact-form">
                <div class="form-group">
                    <label for="contactName">Full Name</label>
                    <input type="text" id="contactName" required>
                </div>
                
                <div class="form-group">
                    <label for="contactEmail">Email Address</label>
                    <input type="email" id="contactEmail" required>
                </div>

                <div class="form-group">
                    <label for="message">Your Message</label>
                    <textarea id="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn-primary">Send Message</button>
            </form>
            <div id="successMessage" style="display: none; margin-top: 1rem; color: var(--success-color); text-align: center; font-weight: bold;">
                Message sent successfully! We will contact you soon.
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('contact-form');
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                // Simulate sending message
                document.getElementById('successMessage').style.display = 'block';
                form.reset();
                setTimeout(() => {
                    document.getElementById('successMessage').style.display = 'none';
                }, 5000);
            });
        });
    </script>
</body>
</html>
